<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingrid Vilharba | Marketing Estratégico & Growth</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff0066, #ffcc00, #33ccff); /* fundo vibrante temporário */
      color: #111;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 50px 20px 30px 20px;
      background: rgba(0,0,0,0.3); /* semi-transparente sobre o gradiente */
      color: #fff;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 20px;
      margin-top: 0;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: rgba(0,0,0,0.6);
      padding: 10px 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ffcc00;
    }

    .icons {
      text-align: center;
      margin: 30px 0;
    }

    .icons img {
      width: 50px;
      margin: 0 10px;
      vertical-align: middle;
    }

    .btn-portfolio {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .btn-portfolio a {
      background-color: #000; /* botão preto */
      color: #fff;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-portfolio a:hover {
      background-color: #333;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #666;
      border-top: 1px solid #ccc;
      background-color: rgba(255,255,255,0.7);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }
      header p {
        font-size: 16px;
      }
      .btn-portfolio a {
        padding: 12px 20px;
        font-size: 14px;
      }
      nav a {
        margin: 0 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Ingrid Vilharba</h1>
    <p>Marketing Estratégico & Growth | Criação, Identidade e Conteúdo</p>
  </header>

  <nav>
    <a href="#sobre">Sobre</a>
    <a href="#servicos">Serviços</a>
    <a href="#contato">Contato</a>
  </nav>

  <div class="icons">
    <a href="https://www.instagram.com/seuusuario" target="_blank">
      <img src="instagram.png" alt="Instagram">
    </a>
    <a href="https://wa.me/seunumerodetelefone" target="_blank">
      <img src="whatsapp.png" alt="WhatsApp">
    </a>
    <a href="https://www.linkedin.com/in/seuusuario" target="_blank">
      <img src="linkedin.png" alt="LinkedIn">
    </a>
  </div>

  <div class="btn-portfolio">
    <a href="portfolio.html">Ver Portfólio</a>
  </div>

  <footer>
    © 2026 — Desenvolvimento, identidade e conteúdos criados por mim.
  </footer>

</body>
</html>
